name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The wrapper owns the whole flow: unit tests, the socket regression and the
      # packaging resource checks. Nothing here duplicates it.
      - name: Test (debug)
        run: bash scripts/setup.sh test

      - name: Test (release)
        run: bash scripts/setup.sh test --release
