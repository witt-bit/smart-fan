name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test -s "docs/releases/${RELEASE_TAG#v}.md"
      - name: Test Debug
        run: bash scripts/setup.sh test
      - name: Test Release
        run: bash scripts/setup.sh test --release
      - name: Build distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/setup.sh package
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        # Publish only after the downloaded artifact has passed local acceptance.
        run: gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --draft --title "SmartFan ${RELEASE_TAG#v}" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
